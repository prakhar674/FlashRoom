<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FlashRoom — 2 Person Booth</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at 10% 10%, #431274, transparent 35%),
                radial-gradient(circle at 90% 90%, #71164f, transparent 35%),
                #08050d;
            color: white;
            font-family: Arial, sans-serif;
            padding: 15px;
        }

        .app {
            width: 100%;
            max-width: 1100px;
            margin: auto;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .brand {
            font-size: 25px;
            font-weight: bold;
            background: linear-gradient(90deg, #c77dff, #ff78c8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .room {
            padding: 8px 12px;
            border-radius: 12px;
            background: rgba(255,255,255,0.08);
            color: #ddaaff;
            font-size: 12px;
        }

        .booth {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 15px;
        }

        .cameras {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .camera-card {
            position: relative;
            min-height: 500px;
            overflow: hidden;
            border-radius: 24px;
            background: #050505;
            border: 1px solid rgba(255,255,255,0.13);
            box-shadow: 0 0 35px rgba(155,60,255,0.2);
        }

        video {
            width: 100%;
            height: 100%;
            min-height: 500px;
            object-fit: cover;
            display: block;
        }

        #localVideo {
            transform: scaleX(-1);
        }

        .camera-label {
            position: absolute;
            left: 12px;
            top: 12px;
            padding: 8px 11px;
            border-radius: 12px;
            background: rgba(0,0,0,0.45);
            backdrop-filter: blur(10px);
            font-size: 12px;
        }

        .online {
            position: absolute;
            right: 12px;
            top: 12px;
            padding: 7px 10px;
            border-radius: 12px;
            background: rgba(60,255,160,0.12);
            color: #9affca;
            font-size: 11px;
        }

        .waiting {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background:
                radial-gradient(circle, #25103b, #08050d);
            color: #bfb1c8;
            text-align: center;
            padding: 20px;
        }

        .waiting-icon {
            font-size: 50px;
            margin-bottom: 12px;
        }

        .waiting strong {
            color: white;
            font-size: 18px;
        }

        .waiting p {
            margin-top: 8px;
            font-size: 13px;
        }

        .side {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .panel {
            padding: 15px;
            border-radius: 20px;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.11);
            backdrop-filter: blur(15px);
        }

        .panel-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 9px;
        }

        button {
            border: none;
            border-radius: 13px;
            padding: 13px 10px;
            color: white;
            background: rgba(255,255,255,0.09);
            border: 1px solid rgba(255,255,255,0.1);
            font-weight: bold;
            cursor: pointer;
        }

        button.primary {
            grid-column: 1 / -1;
            background: linear-gradient(90deg, #8e44ff, #e64fbc);
            box-shadow: 0 0 22px rgba(185,70,255,0.3);
        }

        button.danger {
            background: rgba(255,70,100,0.1);
            color: #ff9baa;
        }

        .chat {
            height: 230px;
            display: flex;
            flex-direction: column;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding-right: 4px;
        }

        .message {
            margin-bottom: 8px;
            padding: 9px 11px;
            border-radius: 12px;
            background: rgba(255,255,255,0.07);
            font-size: 12px;
        }

        .message.me {
            background: rgba(150,70,255,0.2);
            text-align: right;
        }

        .chat-input {
            display: flex;
            gap: 7px;
            margin-top: 10px;
        }

        .chat-input input {
            min-width: 0;
            flex: 1;
            padding: 11px;
            border-radius: 11px;
            border: 1px solid rgba(255,255,255,0.1);
            outline: none;
            background: rgba(0,0,0,0.25);
            color: white;
        }

        .chat-input button {
            padding: 10px 13px;
            background: linear-gradient(90deg, #8e44ff, #e64fbc);
        }

        .capture-status {
            text-align: center;
            margin-top: 10px;
            color: #bcaac5;
            font-size: 12px;
        }

        .countdown {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10;
            font-size: 100px;
            font-weight: bold;
            text-shadow: 0 0 35px #000;
            background: rgba(0,0,0,0.08);
        }

        @media (max-width: 800px) {

            .booth {
                grid-template-columns: 1fr;
            }

            .cameras {
                grid-template-columns: 1fr 1fr;
            }

            .camera-card,
            video {
                min-height: 360px;
            }

            .side {
                display: grid;
                grid-template-columns: 1fr 1fr;
            }

            .chat {
                height: 250px;
            }
        }

        @media (max-width: 500px) {

            body {
                padding: 10px;
            }

            .cameras {
                gap: 7px;
            }

            .camera-card,
            video {
                min-height: 300px;
            }

            .camera-card {
                border-radius: 17px;
            }

            .brand {
                font-size: 21px;
            }

            .side {
                display: flex;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <header>
        <div class="brand">📸 FlashRoom</div>

        <div class="room" id="roomCode">
            ROOM
        </div>
    </header>


    <main class="booth">

        <section class="cameras">

            <!-- YOUR CAMERA -->
            <div class="camera-card">

                <video
                    id="localVideo"
                    autoplay
                    muted
                    playsinline>
                </video>

                <div class="camera-label">
                    You 👤
                </div>

                <div class="online">
                    ● You
                </div>

            </div>


            <!-- FRIEND CAMERA -->
            <div class="camera-card">

                <video
                    id="remoteVideo"
                    autoplay
                    playsinline>
                </video>

                <div class="camera-label">
                    Friend 👥
                </div>

                <div class="online" id="friendStatus">
                    Waiting
                </div>

                <div
                    class="waiting"
                    id="waitingScreen">

                    <div class="waiting-icon">
                        👥
                    </div>

                    <strong>
                        Waiting for friend
                    </strong>

                    <p>
                        Share your room code to join
                    </p>

                </div>

            </div>

        </section>


        <aside class="side">

            <div class="panel">

                <div class="panel-title">
                    🎛 Booth Controls
                </div>

                <div class="controls">

                    <button
                        onclick="flipCamera()">
                        🔄 Flip
                    </button>

                    <button
                        onclick="toggleMic()"
                        id="micButton">
                        🎤 Mic On
                    </button>

                    <button
                        class="primary"
                        onclick="takePhoto()">
                        📸 TAKE PHOTO
                    </button>

                    <button
                        class="danger"
                        onclick="exitRoom()">
                        🚪 Exit Room
                    </button>

                </div>

                <div
                    class="capture-status"
                    id="captureStatus">
                    Ready for your first snap ✨
                </div>

            </div>


            <div class="panel chat">

                <div class="panel-title">
                    💬 Room Chat
                </div>

                <div
                    class="messages"
                    id="messages">

                    <div class="message">
                        Welcome to FlashRoom! ✨
                    </div>

                </div>

                <div class="chat-input">

                    <input
                        id="chatInput"
                        type="text"
                        maxlength="150"
                        placeholder="Type a message...">

                    <button
                        onclick="sendMessage()">
                        ➤
                    </button>

                </div>

            </div>

        </aside>

    </main>

</div>


<div
    class="countdown"
    id="countdown">
</div>


<canvas id="canvas" hidden></canvas>


<script>

    const localVideo =
        document.getElementById("localVideo");

    const remoteVideo =
        document.getElementById("remoteVideo");

    const waitingScreen =
        document.getElementById("waitingScreen");

    const friendStatus =
        document.getElementById("friendStatus");

    const micButton =
        document.getElementById("micButton");

    const captureStatus =
        document.getElementById("captureStatus");

    const countdown =
        document.getElementById("countdown");

    const chatInput =
        document.getElementById("chatInput");

    const messages =
        document.getElementById("messages");


    const roomCode =
        localStorage.getItem("flashroom_room")
        || "FR-DEMO";

    const username =
        localStorage.getItem("flashroom_username")
        || "Guest";


    document.getElementById("roomCode").textContent =
        roomCode;


    let stream = null;

    let facingMode = "user";

    let micEnabled = true;


    /*
        START LOCAL CAMERA
    */

    async function startCamera() {

        try {

            if (stream) {

                stream.getTracks().forEach(
                    track => track.stop()
                );

            }

            stream =
                await navigator.mediaDevices.getUserMedia({

                    video: {
                        facingMode: facingMode
                    },

                    audio: true

                });

            localVideo.srcObject = stream;

            if (facingMode === "user") {

                localVideo.style.transform =
                    "scaleX(-1)";

            } else {

                localVideo.style.transform =
                    "scaleX(1)";

            }

            const audioTrack =
                stream.getAudioTracks()[0];

            if (audioTrack) {

                audioTrack.enabled =
                    micEnabled;

            }

            captureStatus.textContent =
                "Camera ready 📸";

        }

        catch (error) {

            console.error(error);

            captureStatus.textContent =
                "Camera permission required.";

            alert(
                "Please allow camera and microphone access."
            );

        }

    }


    /*
        CAMERA FLIP
    */

    function flipCamera() {

        facingMode =
            facingMode === "user"
                ? "environment"
                : "user";

        startCamera();

    }


    /*
        MICROPHONE
    */

    function toggleMic() {

        if (!stream) return;

        const audioTracks =
            stream.getAudioTracks();

        if (!audioTracks.length) return;

        micEnabled = !micEnabled;

        audioTracks.forEach(
            track => {
                track.enabled = micEnabled;
            }
        );

        micButton.textContent =
            micEnabled
                ? "🎤 Mic On"
                : "🔇 Mic Off";

    }


    /*
        PHOTO COUNTDOWN
    */

    function takePhoto() {

        if (!stream) {

            startCamera();

            return;

        }

        let number = 3;

        countdown.style.display =
            "flex";

        countdown.textContent =
            number;

        const timer =
            setInterval(() => {

                number--;

                if (number > 0) {

                    countdown.textContent =
                        number;

                } else {

                    clearInterval(timer);

                    countdown.textContent =
                        "📸";

                    setTimeout(() => {

                        countdown.style.display =
                            "none";

                        capturePhoto();

                    }, 250);

                }

            }, 1000);

    }


    /*
        CAPTURE CURRENT FRAME
    */

    function capturePhoto() {

        const canvas =
            document.getElementById("canvas");

        const ctx =
            canvas.getContext("2d");

        canvas.width =
            localVideo.videoWidth;

        canvas.height =
            localVideo.videoHeight;

        if (facingMode === "user") {

            ctx.translate(
                canvas.width,
                0
            );

            ctx.scale(-1, 1);

        }

        ctx.drawImage(
            localVideo,
            0,
            0,
            canvas.width,
            canvas.height
        );

        const image =
            canvas.toDataURL(
                "image/jpeg",
                0.92
            );

        localStorage.setItem(
            "flashroom_last_photo",
            image
        );

        captureStatus.textContent =
            "Photo captured! ✨";

    }


    /*
        CHAT
        Local demo for now.
        Real-time chat comes with the server.
    */

    function sendMessage() {

        const text =
            chatInput.value.trim();

        if (!text) return;

        addMessage(
            username + ": " + text,
            true
        );

        chatInput.value = "";

    }


    function addMessage(
        text,
        mine = false
    ) {

        const div =
            document.createElement("div");

        div.className =
            mine
                ? "message me"
                : "message";

        div.textContent =
            text;

        messages.appendChild(div);

        messages.scrollTop =
            messages.scrollHeight;

    }


    chatInput.addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                sendMessage();

            }

        }
    );


    /*
        EXIT
    */

    function exitRoom() {

        if (stream) {

            stream.getTracks().forEach(
                track => track.stop()
            );

        }

        window.location.href =
            "waiting.html";

    }


    /*
        START
    */

    startCamera();

</script>

</body>
</html>
