<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FlashRoom — Gallery</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
            background:
                radial-gradient(circle at 10% 10%, #431274, transparent 35%),
                radial-gradient(circle at 90% 90%, #74164f, transparent 35%),
                #08050d;
            padding: 16px;
        }

        .app {
            width: 100%;
            max-width: 1000px;
            margin: auto;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .title {
            font-size: 27px;
            font-weight: bold;
            background: linear-gradient(90deg, #c77dff, #ff78c8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .back {
            padding: 9px 13px;
            border-radius: 12px;
            color: white;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            cursor: pointer;
        }

        .editor {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 16px;
        }

        .preview-card,
        .tools {
            padding: 16px;
            border-radius: 23px;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.12);
            backdrop-filter: blur(16px);
        }

        .preview {
            width: 100%;
            min-height: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border-radius: 18px;
            background: #030303;
        }

        #previewImage {
            max-width: 100%;
            max-height: 65vh;
            object-fit: contain;
            transition: 0.2s;
        }

        .empty {
            color: #81768a;
            text-align: center;
            padding: 30px;
        }

        .tool-title {
            margin-bottom: 13px;
            font-size: 15px;
            font-weight: bold;
        }

        .tool {
            margin-bottom: 16px;
        }

        label {
            display: flex;
            justify-content: space-between;
            color: #cfc3d5;
            font-size: 12px;
            margin-bottom: 7px;
        }

        input[type="range"] {
            width: 100%;
            accent-color: #b75cff;
        }

        .filters {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 7px;
        }

        button {
            padding: 11px 8px;
            border: none;
            border-radius: 12px;
            color: white;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            transform: translateY(-1px);
        }

        .actions {
            display: grid;
            gap: 9px;
            margin-top: 8px;
        }

        .primary {
            background: linear-gradient(90deg, #8e44ff, #e64fbc);
        }

        .reset {
            background: rgba(255,80,110,0.1);
            color: #ff9baa;
        }

        .strip-title {
            margin-top: 20px;
            margin-bottom: 10px;
            color: #d6cadc;
            font-size: 14px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .thumb {
            aspect-ratio: 3 / 4;
            overflow: hidden;
            border-radius: 12px;
            background: rgba(255,255,255,0.06);
            cursor: pointer;
        }

        .thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        @media (max-width: 800px) {
            .editor {
                grid-template-columns: 1fr;
            }

            .preview {
                min-height: 400px;
            }
        }

        @media (max-width: 500px) {
            body {
                padding: 10px;
            }

            .title {
                font-size: 22px;
            }

            .preview {
                min-height: 360px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <header>

        <div class="title">
            🖼️ FlashRoom Gallery
        </div>

        <button
            class="back"
            onclick="goBack()">
            ← Booth
        </button>

    </header>


    <main class="editor">

        <section class="preview-card">

            <div
                class="preview"
                id="preview">

                <div
                    class="empty"
                    id="emptyMessage">

                    No photo captured yet 📸

                </div>

                <img
                    id="previewImage"
                    alt="FlashRoom photo"
                    hidden>

            </div>

        </section>


        <aside class="tools">

            <div class="tool-title">
                🎨 Edit Photo
            </div>


            <div class="tool">

                <label>
                    <span>Brightness</span>
                    <span id="brightnessValue">100%</span>
                </label>

                <input
                    id="brightness"
                    type="range"
                    min="50"
                    max="150"
                    value="100">

            </div>


            <div class="tool">

                <label>
                    <span>Contrast</span>
                    <span id="contrastValue">100%</span>
                </label>

                <input
                    id="contrast"
                    type="range"
                    min="50"
                    max="150"
                    value="100">

            </div>


            <div class="tool">

                <label>
                    <span>Saturation</span>
                    <span id="saturationValue">100%</span>
                </label>

                <input
                    id="saturation"
                    type="range"
                    min="0"
                    max="200"
                    value="100">

            </div>


            <div class="tool">

                <label>
                    <span>Blur</span>
                    <span id="blurValue">0px</span>
                </label>

                <input
                    id="blur"
                    type="range"
                    min="0"
                    max="8"
                    value="0">

            </div>


            <div class="tool">

                <label>
                    <span>Filters</span>
                </label>

                <div class="filters">

                    <button onclick="setFilter('none')">
                        Normal
                    </button>

                    <button onclick="setFilter('grayscale(1)')">
                        Mono
                    </button>

                    <button onclick="setFilter('sepia(0.8)')">
                        Retro
                    </button>

                    <button onclick="setFilter('hue-rotate(45deg)')">
                        Dream
                    </button>

                </div>

            </div>


            <div class="actions">

                <button
                    onclick="rotatePhoto()">
                    🔄 Rotate
                </button>

                <button
                    class="primary"
                    onclick="downloadPhoto()">
                    ⬇️ Download Photo
                </button>

                <button
                    class="reset"
                    onclick="resetEditor()">
                    ↩ Reset
                </button>

            </div>

        </aside>

    </main>


    <div class="strip-title">
        📸 Your captured photos
    </div>

    <section
        class="gallery"
        id="gallery">
    </section>

</div>


<canvas id="canvas" hidden></canvas>


<script>

    const image =
        document.getElementById("previewImage");

    const empty =
        document.getElementById("emptyMessage");

    const canvas =
        document.getElementById("canvas");


    let brightness = 100;
    let contrast = 100;
    let saturation = 100;
    let blur = 0;
    let rotation = 0;
    let filter = "none";


    /*
        LOAD LAST PHOTO
    */

    const savedPhoto =
        localStorage.getItem(
            "flashroom_last_photo"
        );


    if (savedPhoto) {

        showPhoto(savedPhoto);

        addThumbnail(savedPhoto);

    }


    /*
        SHOW PHOTO
    */

    function showPhoto(src) {

        image.src = src;

        image.hidden = false;

        empty.style.display =
            "none";

        applyEffects();

    }


    /*
        EFFECTS
    */

    function applyEffects() {

        image.style.filter =
            `brightness(${brightness}%)
             contrast(${contrast}%)
             saturate(${saturation}%)
             blur(${blur}px)
             ${filter === "none" ? "" : filter}`;

        image.style.transform =
            `rotate(${rotation}deg)`;

    }


    /*
        SLIDERS
    */

    document.getElementById("brightness")
        .addEventListener("input", function() {

            brightness = this.value;

            document.getElementById(
                "brightnessValue"
            ).textContent =
                brightness + "%";

            applyEffects();

        });


    document.getElementById("contrast")
        .addEventListener("input", function() {

            contrast = this.value;

            document.getElementById(
                "contrastValue"
            ).textContent =
                contrast + "%";

            applyEffects();

        });


    document.getElementById("saturation")
        .addEventListener("input", function() {

            saturation = this.value;

            document.getElementById(
                "saturationValue"
            ).textContent =
                saturation + "%";

            applyEffects();

        });


    document.getElementById("blur")
        .addEventListener("input", function() {

            blur = this.value;

            document.getElementById(
                "blurValue"
            ).textContent =
                blur + "px";

            applyEffects();

        });


    /*
        FILTER
    */

    function setFilter(value) {

        filter = value;

        applyEffects();

    }


    /*
        ROTATE
    */

    function rotatePhoto() {

        rotation += 90;

        if (rotation >= 360) {
            rotation = 0;
        }

        applyEffects();

    }


    /*
        RESET
    */

    function resetEditor() {

        brightness = 100;
        contrast = 100;
        saturation = 100;
        blur = 0;
        rotation = 0;
        filter = "none";

        document.getElementById(
            "brightness"
        ).value = 100;

        document.getElementById(
            "contrast"
        ).value = 100;

        document.getElementById(
            "saturation"
        ).value = 100;

        document.getElementById(
            "blur"
        ).value = 0;

        document.getElementById(
            "brightnessValue"
        ).textContent = "100%";

        document.getElementById(
            "contrastValue"
        ).textContent = "100%";

        document.getElementById(
            "saturationValue"
        ).textContent = "100%";

        document.getElementById(
            "blurValue"
        ).textContent = "0px";

        applyEffects();

    }


    /*
        THUMBNAIL
    */

    function addThumbnail(src) {

        const gallery =
            document.getElementById(
                "gallery"
            );

        const div =
            document.createElement("div");

        div.className =
            "thumb";

        const img =
            document.createElement("img");

        img.src = src;

        div.appendChild(img);

        div.onclick = function() {

            showPhoto(src);

        };

        gallery.appendChild(div);

    }


    /*
        DOWNLOAD
    */

    function downloadPhoto() {

        if (!image.src) {

            alert(
                "There is no photo to download."
            );

            return;

        }

        canvas.width =
            image.naturalWidth;

        canvas.height =
            image.naturalHeight;

        const ctx =
            canvas.getContext("2d");

        ctx.save();

        ctx.translate(
            canvas.width / 2,
            canvas.height / 2
        );

        ctx.rotate(
            rotation * Math.PI / 180
        );

        ctx.filter =
            `brightness(${brightness}%)
             contrast(${contrast}%)
             saturate(${saturation}%)
             blur(${blur}px)
             ${filter === "none" ? "" : filter}`;

        ctx.drawImage(
            image,
            -canvas.width / 2,
            -canvas.height / 2
        );

        ctx.restore();

        const link =
            document.createElement("a");

        link.download =
            "flashroom-photo.jpg";

        link.href =
            canvas.toDataURL(
                "image/jpeg",
                0.95
            );

        link.click();

    }


    /*
        BACK
    */

    function goBack() {

        window.location.href =
            "booth.html";

    }

</script>

</body>
</html>
